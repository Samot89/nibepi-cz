# Home Assistant pro zdroj cen "Home Assistant (MQTT)" a FVE boost.
# Návod je v README.md v této složce.
#
# Použití jako package: uložte jako config/packages/nibepi.yaml a zapněte
#   homeassistant:
#     packages: !include_dir_named packages
# nebo senzor a automatizace zkopírujte do vlastních souborů.
#
# NibePi čte tyto MQTT topicy (retained):
#   nibepi/price/czk          aktuální nákupní cena, Kč/kWh
#   nibepi/price/czk_hourly   hodinové ceny dnes + zítra pro VV-AI, [{startsAt, total}]
#   nibepi/solar/surplus      průměrné FVE přetoky do sítě, W
#
# Nahraďte ID entit svými:
#   sensor.current_buy_electricity_price_15min  cena za kWh včetně poplatků,
#                                               např. z integrace CZ Energy Spot Prices
#   sensor.grid_export_power                    okamžité přetoky do sítě ve W
#   sensor.indoor_temperature                   pokojová teplota

# --- configuration.yaml: pokojová teplota pro NibePi (nahraďte svou entitou)
mqtt_statestream:
  base_topic: homeassistant
  include:
    entities:
      - sensor.indoor_temperature

# --- configuration.yaml: vyhlazení přetoků, aby mraky nepřepínaly cenovou hladinu
sensor:
  - platform: statistics
    name: "PV surplus average"
    unique_id: pv_surplus_average
    entity_id: sensor.grid_export_power
    state_characteristic: average_step
    max_age:
      minutes: 10
    sampling_size: 1000
    precision: 2

# --- automations.yaml
automation:
  - id: nibepi_spot_price_mqtt
    alias: "NibePi - nákupní cena -> MQTT"
    triggers:
      - trigger: state
        entity_id: sensor.current_buy_electricity_price_15min
      - trigger: homeassistant
        event: start
    conditions:
      - condition: template
        value_template: "{{ states('sensor.current_buy_electricity_price_15min') not in ['unknown', 'unavailable', 'None'] }}"
    actions:
      - action: mqtt.publish
        data:
          topic: nibepi/price/czk
          payload: "{{ states('sensor.current_buy_electricity_price_15min') }}"
          retain: true
    mode: single

  # Hodinové průměry 15minutových cen (atributy cenového senzoru, dnes a zítra).
  # VV-AI si drží jednu cenu na hodinu týdne, 15minutové hodnoty by z každé hodiny
  # nechaly jen poslední čtvrthodinu.
  - id: nibepi_hourly_price_list_mqtt
    alias: "NibePi - hodinový ceník -> MQTT"
    triggers:
      - trigger: state
        entity_id: sensor.current_buy_electricity_price_15min
      - trigger: homeassistant
        event: start
    conditions:
      - condition: template
        value_template: "{{ states('sensor.current_buy_electricity_price_15min') not in ['unknown', 'unavailable', 'None'] }}"
    actions:
      - action: mqtt.publish
        data:
          topic: nibepi/price/czk_hourly
          retain: true
          payload: >-
            {% set a = states.sensor.current_buy_electricity_price_15min.attributes %}
            {% set ns = namespace(out=[]) %}
            {% for k in a.keys() if k is string and k[:2] == '20' and k[14:16] == '00' %}
            {% set acc = namespace(s=0, n=0) %}
            {% for m in ['00', '15', '30', '45'] %}
            {% set v = a.get(k[:14] ~ m ~ k[16:]) %}
            {% if v is number %}{% set acc.s = acc.s + v %}{% set acc.n = acc.n + 1 %}{% endif %}
            {% endfor %}
            {% if acc.n > 0 %}{% set ns.out = ns.out + [{'startsAt': k, 'total': (acc.s / acc.n) | round(4)}] %}{% endif %}
            {% endfor %}
            {{ ns.out | tojson }}
    mode: single

  - id: nibepi_pv_surplus_mqtt
    alias: "NibePi - FVE přetoky -> MQTT"
    triggers:
      - trigger: state
        entity_id: sensor.pv_surplus_average
      - trigger: homeassistant
        event: start
    actions:
      - action: mqtt.publish
        data:
          topic: nibepi/solar/surplus
          payload: "{{ [states('sensor.pv_surplus_average') | float(0), 0] | max | round(0) | int }}"
          retain: true
    mode: single

  # Volitelné: boost TUV (registr 48132 = 4, dočasný Lux) při záporné ceně, jen v 1. nebo
  # 2. nejlevnější hodině dne a jen když žádný boost neběží.
  - id: nibepi_hw_boost_negative_price
    alias: "NibePi - boost TUV při záporné ceně"
    triggers:
      - trigger: state
        entity_id: sensor.current_buy_electricity_price_15min
      - trigger: homeassistant
        event: start
    conditions:
      - condition: template
        value_template: "{{ states('sensor.current_buy_electricity_price_15min') | float(99) < 0 }}"
      - condition: numeric_state
        entity_id: sensor.current_spot_electricity_hour_order
        below: 3
      # Registr 48132 (Temporary Lux); discovery NibePi 2.0 ho pojmenuje sensor.nibe_<model>_temporary_lux_2
      - condition: state
        entity_id: sensor.nibe_vvm320_temporary_lux_2
        state: "0"
    actions:
      - action: mqtt.publish
        data:
          topic: nibe/modbus/48132/set
          payload: "4"
          retain: false
    mode: single
