# Home Assistant pro zdroj cen "Home Assistant (MQTT)" a FVE boost.
# Návod je v README.md v této složce.
#
# Použití jako package: uložte jako config/packages/nibepi.yaml a zapněte
#   homeassistant:
#     packages: !include_dir_named packages
# nebo senzor a automatizace zkopírujte do vlastních souborů.
#
# NibePi čte tyto MQTT topicy (retained):
#   nibepi/price/czk          aktuální nákupní cena, Kč/kWh
#   nibepi/price/czk_hourly   hodinové ceny dnes + zítra pro VV-AI, [{startsAt, total}]
#   nibepi/solar/surplus      průměrné FVE přetoky do sítě, W
#   nibepi/price/thresholds/{very_cheap,cheap,normal,expensive}
#                             volitelné: cenové prahy podle dne, mají přednost před prahy
#                             zadanými v dashboardu NibePi
#
# Nahraďte ID entit svými:
#   sensor.current_buy_electricity_price_15min  cena za kWh včetně poplatků,
#                                               např. z integrace CZ Energy Spot Prices
#     Máte-li jen spotovou cenu (sensor.current_spot_electricity_price_15min), dopočítejte
#     nákupní cenu v šablonách: (spot * 1.21 + poplatek obchodníka s DPH), např.
#     {{ (states('sensor.current_spot_electricity_price_15min') | float * 1.21 + 0.4235) | round(4) }}
#
# NibePi ignoruje cenu starší než 60 minut (cenové řízení pak vypne: posun 0, TUV Normal).
# Proto automatizace níže posílá cenu i každých 15 minut, když se nezměnila.
#   sensor.grid_export_power                    okamžité přetoky do sítě ve W
#   sensor.indoor_temperature                   pokojová teplota

# --- configuration.yaml: pokojová teplota pro NibePi (nahraďte svou entitou)
mqtt_statestream:
  base_topic: homeassistant
  include:
    entities:
      - sensor.indoor_temperature

# --- configuration.yaml: vyhlazení přetoků, aby mraky nepřepínaly cenovou hladinu
sensor:
  - platform: statistics
    name: "PV surplus average"
    unique_id: pv_surplus_average
    entity_id: sensor.grid_export_power
    state_characteristic: average_step
    max_age:
      minutes: 10
    sampling_size: 1000
    precision: 2

# --- automations.yaml
automation:
  - id: nibepi_spot_price_mqtt
    alias: "NibePi - nákupní cena -> MQTT"
    triggers:
      - trigger: state
        entity_id: sensor.current_buy_electricity_price_15min
      - trigger: homeassistant
        event: start
      # i beze změny ceny, aby NibePi věděl, že je cena čerstvá
      - trigger: time_pattern
        minutes: "/15"
        seconds: "20"
    conditions:
      - condition: template
        value_template: "{{ states('sensor.current_buy_electricity_price_15min') not in ['unknown', 'unavailable', 'None'] }}"
    actions:
      - action: mqtt.publish
        data:
          topic: nibepi/price/czk
          payload: "{{ states('sensor.current_buy_electricity_price_15min') }}"
          retain: true
    mode: single

  # Pojistka: cena nedostupná 30 minut -> smazat uloženou cenu, NibePi pak řídí bez ceny
  # (posun 0, TUV Normal) a po restartu nenačte starou hodnotu.
  - id: nibepi_price_unavailable_clear
    alias: "NibePi - cena nedostupná -> smazat cenu v MQTT"
    triggers:
      - trigger: state
        entity_id: sensor.current_buy_electricity_price_15min
        to: ["unavailable", "unknown"]
        for:
          minutes: 30
    actions:
      - action: mqtt.publish
        data:
          topic: nibepi/price/czk
          payload: ""
          retain: true
    mode: single

  # Hodinové průměry 15minutových cen (atributy cenového senzoru, dnes a zítra).
  # VV-AI si drží jednu cenu na hodinu týdne, 15minutové hodnoty by z každé hodiny
  # nechaly jen poslední čtvrthodinu.
  - id: nibepi_hourly_price_list_mqtt
    alias: "NibePi - hodinový ceník -> MQTT"
    triggers:
      - trigger: state
        entity_id: sensor.current_buy_electricity_price_15min
      - trigger: homeassistant
        event: start
    conditions:
      - condition: template
        value_template: "{{ states('sensor.current_buy_electricity_price_15min') not in ['unknown', 'unavailable', 'None'] }}"
    actions:
      - action: mqtt.publish
        data:
          topic: nibepi/price/czk_hourly
          retain: true
          payload: >-
            {% set a = states.sensor.current_buy_electricity_price_15min.attributes %}
            {% set ns = namespace(out=[]) %}
            {% for k in a.keys() if k is string and k[:2] == '20' and k[14:16] == '00' %}
            {% set acc = namespace(s=0, n=0) %}
            {% for m in ['00', '15', '30', '45'] %}
            {% set v = a.get(k[:14] ~ m ~ k[16:]) %}
            {% if v is number %}{% set acc.s = acc.s + v %}{% set acc.n = acc.n + 1 %}{% endif %}
            {% endfor %}
            {% if acc.n > 0 %}{% set ns.out = ns.out + [{'startsAt': k, 'total': (acc.s / acc.n) | round(4)}] %}{% endif %}
            {% endfor %}
            {{ ns.out | tojson }}
    mode: single

  # Volitelné: cenové prahy podle dne. Z dnešních 15minutových cen spočítá percentily
  # (nejlevnějších 20 % = velmi nízká, dalších 20 % = nízká, nejdražších 25 % = vysoká,
  # nejdražších 10 % = velmi vysoká). Minima drží rozumné hranice: velmi nízká vždy
  # pod 4,5 Kč a nízká vždy pod 6 Kč, vysoká nejdřív od 8 Kč a velmi vysoká nejdřív od 10 Kč.
  # Každý den se tak přitápí v jeho nejlevnějších hodinách, v drahé sezóně i v levné.
  # Zrušení: vypnout automatizaci a na 4 topicy poslat prázdný retained payload,
  # NibePi se vrátí k prahům z dashboardu.
  - id: nibepi_dynamic_price_thresholds
    alias: "NibePi - cenové prahy podle dne -> MQTT"
    triggers:
      - trigger: time
        at: "00:00:30"
      - trigger: time_pattern
        minutes: "5"
      - trigger: homeassistant
        event: start
    conditions:
      - condition: template
        value_template: "{{ states('sensor.current_buy_electricity_price_15min') not in ['unknown', 'unavailable', 'None'] }}"
    actions:
      - variables:
          pct_vc: 0.20
          pct_c: 0.40
          pct_n: 0.75
          pct_e: 0.90
          min_vc: 4.5
          min_c: 6.0
          min_n: 8.0
          min_e: 10.0
          # Šablona musí vrátit čistý seznam bez mezer okolo (proto pomlčky ve značkách),
          # jinak by ji Home Assistant nevzal jako seznam, ale jako text.
          prices: >-
            {%- set a = states.sensor.current_buy_electricity_price_15min.attributes -%}
            {%- set d = now().strftime('%Y-%m-%d') -%}
            {%- set ns = namespace(v=[]) -%}
            {%- for k in a.keys() if k is string and k[:10] == d and a[k] is number -%}
            {%- set ns.v = ns.v + [a[k]] -%}
            {%- endfor -%}
            {{- ns.v | sort -}}
      - condition: template
        value_template: "{{ prices | count >= 48 }}"
      - variables:
          t_vc: "{{ ([prices[((prices | count - 1) * pct_vc) | round | int], min_vc] | max) | round(2) }}"
          t_c_raw: "{{ ([prices[((prices | count - 1) * pct_c) | round | int], min_c] | max) | round(2) }}"
          t_n_raw: "{{ ([prices[((prices | count - 1) * pct_n) | round | int], min_n] | max) | round(2) }}"
          t_e_raw: "{{ ([prices[((prices | count - 1) * pct_e) | round | int], min_e] | max) | round(2) }}"
      - variables:
          t_c: "{{ ([t_c_raw | float, t_vc | float + 0.01] | max) | round(2) }}"
          t_n: "{{ ([t_n_raw | float, t_c_raw | float + 0.02] | max) | round(2) }}"
          t_e: "{{ ([t_e_raw | float, t_n_raw | float + 0.03] | max) | round(2) }}"
      - action: mqtt.publish
        data: {topic: nibepi/price/thresholds/very_cheap, payload: "{{ t_vc }}", retain: true}
      - action: mqtt.publish
        data: {topic: nibepi/price/thresholds/cheap, payload: "{{ t_c }}", retain: true}
      - action: mqtt.publish
        data: {topic: nibepi/price/thresholds/normal, payload: "{{ t_n }}", retain: true}
      - action: mqtt.publish
        data: {topic: nibepi/price/thresholds/expensive, payload: "{{ t_e }}", retain: true}
    mode: single

  - id: nibepi_pv_surplus_mqtt
    alias: "NibePi - FVE přetoky -> MQTT"
    triggers:
      - trigger: state
        entity_id: sensor.pv_surplus_average
      - trigger: homeassistant
        event: start
    actions:
      - action: mqtt.publish
        data:
          topic: nibepi/solar/surplus
          payload: "{{ [states('sensor.pv_surplus_average') | float(0), 0] | max | round(0) | int }}"
          retain: true
    mode: single

  # Volitelné: boost TUV (registr 48132 = 4, dočasný Lux) při záporné ceně, jen v 1. nebo
  # 2. nejlevnější hodině dne a jen když žádný boost neběží.
  - id: nibepi_hw_boost_negative_price
    alias: "NibePi - boost TUV při záporné ceně"
    triggers:
      - trigger: state
        entity_id: sensor.current_buy_electricity_price_15min
      - trigger: homeassistant
        event: start
    conditions:
      - condition: template
        value_template: "{{ states('sensor.current_buy_electricity_price_15min') | float(99) < 0 }}"
      - condition: numeric_state
        entity_id: sensor.current_spot_electricity_hour_order
        below: 3
      # Registr 48132 (Temporary Lux); discovery NibePi 2.0 ho pojmenuje sensor.nibe_<model>_temporary_lux_2
      - condition: state
        entity_id: sensor.nibe_vvm320_temporary_lux_2
        state: "0"
    actions:
      - action: mqtt.publish
        data:
          topic: nibe/modbus/48132/set
          payload: "4"
          retain: false
    mode: single
